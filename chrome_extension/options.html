<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SATWidget GP Updater — настройки</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      min-width: 360px;
      background: #f5f6f8;
      color: #1a1a1a;
    }
    h1 { font-size: 16px; margin: 0 0 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1660c4; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    #status { margin-top: 10px; font-size: 13px; color: #0a7d31; }
    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }
  </style>
</head>
<body>
  <h1>SATWidget GP Updater</h1>

  <div class="row">
    <div class="field">
      <label for="port">Порт приёмника SATWidget</label>
      <input type="number" id="port" min="1" max="65535" value="9090">
      <div class="hint">Python-виджет слушает этот порт на 127.0.0.1 (статус + GP).</div>
    </div>
    <div class="field">
      <label for="interval">Опрос виджета (мин)</label>
      <input type="number" id="interval" min="1" max="60" value="1">
      <div class="hint">Как часто спрашивать виджет, нужны ли свежие GP-данные.</div>
    </div>
  </div>

  <div class="field">
    <label for="provider">Источник данных</label>
    <select id="provider">
      <option value="space_track">Space-Track</option>
      <option value="celestrak">CelesTrak (публичный)</option>
      <option value="both">Сначала Space-Track, затем CelesTrak</option>
    </select>
    <div class="hint">
      Логин/пароль Space-Track расширение берёт у виджета (секция
      space_track в config.json) и не хранит у себя.
    </div>
  </div>

  <button id="save">Сохранить</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
